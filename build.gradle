plugins {
    id 'java-library'
    // Resolves JavaFX artifacts and native libraries for the host platform.
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'io.freefair.lombok' version '9.8.2'
}

group = 'de.olaf-roeder'
version = '1.0.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
    withSourcesJar()
    withJavadocJar()
}

// JavaFX 27 itself requires Java 25 or newer.
tasks.named('compileJava', JavaCompile) { options.release = 25 }
lombok { version = '1.18.48' }
tasks.named('updateDaemonJvm') { toolchainPlatforms = [] }

repositories { mavenCentral() }

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')
    implementation 'org.apache.logging.log4j:log4j-api'
    runtimeOnly 'org.apache.logging.log4j:log4j-core'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl'
}

javafx {
    version = '27'
    modules = ['javafx.controls', 'javafx.fxml']
}

// src/test contains an interactive demo, not automated test cases.
tasks.named('test', Test) { failOnNoDiscoveredTests = false }
